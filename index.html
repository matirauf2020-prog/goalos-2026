<!DOCTYPE html>

<head>

      <div class="nav-caption">WORKSPACE</div>

        <button class="nav-item" data-page="transactions"><svg><use href="#i-wallet"></use></svg><span>Transactions</span></button>
        <button class="nav-item" data-page="tasks"><svg><use href="#i-check"></use></svg><span>Goal tracker</span></button>
        <button class="nav-item" data-page="loans"><svg><use href="#i-loan"></use></svg><span>Loans</span></button>
        <button class="nav-item" data-page="analytics"><svg><use href="#i-chart"></use></svg><span>Analytics</span></button>
        <button class="nav-item" data-page="workbook"><svg><use href="#i-book"></use></svg><span>Workbook explorer</span></button>
      </nav>
      <div class="sidebar-separator"></div>
      <div class="nav-caption">PREFERENCES</div>

    <div class="workspace-main">

        <div class="topbar-left"><button class="icon-button menu-button" id="menuToggle" aria-label="Open navigation"><svg><use href="#i-menu"></use></svg></button><div class="topbar-location"><span>Workspace</span><span class="bread-slash">/</span><strong id="breadcrumb">Overview</strong></div></div>
